# DYNOSHI — Daily Anime Short renderer
#
# Triggered from Make.com via the GitHub API:
#   POST https://api.github.com/repos/<owner>/<repo>/dispatches
#   Headers: Authorization: Bearer <GITHUB_TOKEN>, Accept: application/vnd.github+json
#   Body: {
#     "event_type": "render-short",
#     "client_payload": {
#       "title":  "Black Clover ... | ... Full Fight",
#       "script": "Kya aap soch sakte ho ki ...",
#       "scenes": ["epic anime scene, ...", "..."]   // optional scene prompts
#     }
#   }
#
# The workflow generates the Hindi voiceover with edge-tts, downloads one
# AI scene image per scene prompt (Pollinations, free — scripts/make-images.py;
# built-in pilot prompts when none are given), renders the vertical Short
# with Remotion, re-encodes it under 5 MB with ffmpeg (so it can pass back
# through Make's free plan), and uploads the MP4 as a workflow artifact
# named "short-mp4" for the next step to pick up.
#
# Direct publish (added on top of the artifact upload):
#   The re-encoded MP4 is also uploaded as the "short.mp4" asset of the
#   fixed GitHub Release tagged "daily-latest" (created on first use,
#   overwritten with --clobber on every run), giving it a stable public
#   direct-download URL:
#     https://github.com/henry-an-japan/dynoshi-auto-shorts/releases/download/daily-latest/short.mp4
#   Afterwards, if the repository secret MAKE_WEBHOOK_URL is set, the
#   workflow POSTs a JSON payload ({title, video_url, run_id}, plus
#   description/tags when they arrived in the dispatch client_payload —
#   or, for manual runs, in the workflow_dispatch "description" and
#   "tags" (comma-separated) inputs) to that Make.com webhook so Make
#   can fetch the file and upload it to YouTube. When the secret is empty the webhook step is skipped quietly.
#   Publishing the release asset is why the workflow needs
#   "permissions: contents: write".

name: Render Anime Short

on:
  repository_dispatch:
    types: [render-short]
  # Manual test runs from the Actions tab (uses the pilot script).
  workflow_dispatch:
    inputs:
      title:
        description: "Video title"
        required: false
        default: 'Black Clover S2 Episode 7 "Beyond Despair" Explained in Hindi | Noelle vs Megicula Full Fight'
      script:
        description: "Voiceover script (plain text)"
        required: false
        default: ""
      scenes:
        description: "Scene image prompts, one per line"
        required: false
        default: ""
      description:
        description: "Video description (forwarded to the Make webhook)"
        required: false
        default: ""
      tags:
        description: "Video tags, comma-separated (forwarded to the Make webhook)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve title + script from the dispatch payload
        id: payload
        env:
          PAYLOAD_TITLE: ${{ github.event.client_payload.title }}
          PAYLOAD_SCRIPT: ${{ github.event.client_payload.script }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_SCRIPT: ${{ inputs.script }}
        run: |
          TITLE="${PAYLOAD_TITLE:-$INPUT_TITLE}"
          SCRIPT="${PAYLOAD_SCRIPT:-$INPUT_SCRIPT}"
          if [ -z "$SCRIPT" ]; then
            # Fall back to the bundled pilot script (manual smoke test).
            SCRIPT="$(cat pilot-script.txt)"
          fi
          printf '%s' "$SCRIPT" > script.txt
          printf '%s' "$TITLE" > title.txt
          echo "Title: $TITLE"
          echo "Script chars: ${#SCRIPT}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Install Python dependencies (edge-tts)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Generate Hindi voiceover (edge-tts, hi-IN-SwaraNeural)
        run: .venv/bin/python scripts/make-voiceover.py script.txt public/voiceover.mp3 hi-IN-SwaraNeural

      - name: Write scene prompts (scenes.json)
        env:
          PAYLOAD_SCENES_JSON: ${{ toJSON(github.event.client_payload.scenes) }}
          INPUT_SCENES: ${{ inputs.scenes }}
        run: |
          python3 - <<'EOF'
          import json, os
          # Built-in pilot scene prompts (anime-style, descriptive, no studio
          # frames) used when neither the dispatch payload nor the manual
          # input supplies prompts.
          DEFAULT_SCENES = [
              "epic anime scene, silver-haired girl water mage in ornate dress casting a huge swirling water spell, dramatic battle, cinematic lighting, ultra detailed anime style, vertical composition",
              "dark anime demon villainess with horns and glowing purple eyes surrounded by cursed chains and dark aura, menacing smile, ultra detailed anime style, vertical composition",
              "anime magic knights battlefield with clashing spells, blue water magic versus dark curse magic explosion, dynamic action, ultra detailed anime style, vertical composition",
              "emotional close-up anime girl with tears and determined expression gripping a glowing grimoire, sparkling water droplets around her, ultra detailed anime style, vertical composition",
              "anime boy with black sword and anti-magic aura standing protectively beside allies, burning battlefield background, ultra detailed anime style, vertical composition",
              "triumphant anime heroes at sunrise after a magical battle, hopeful sky, sparkling light particles, ultra detailed anime style, vertical composition",
          ]
          scenes = None
          raw = os.environ.get("PAYLOAD_SCENES_JSON", "")
          if raw and raw != "null":
              try:
                  parsed = json.loads(raw)
              except json.JSONDecodeError:
                  parsed = None
              if isinstance(parsed, list):
                  scenes = [str(p).strip() for p in parsed if str(p).strip()] or None
          if not scenes:
              lines = [l.strip() for l in os.environ.get("INPUT_SCENES", "").splitlines() if l.strip()]
              if lines:
                  scenes = lines
          if not scenes:
              scenes = DEFAULT_SCENES
          open("scenes.json", "w", encoding="utf-8").write(json.dumps(scenes, ensure_ascii=False, indent=2))
          print(f"scenes.json written with {len(scenes)} prompt(s)")
          EOF

      - name: Generate scene images (Pollinations, free)
        run: .venv/bin/python scripts/make-images.py scenes.json public/scenes

      - name: Build Remotion props
        run: |
          python3 - <<'EOF'
          import glob, json, os, re
          def scene_number(path):
              m = re.search(r"scene-(\d+)\.jpg$", path)
              return int(m.group(1)) if m else 0
          scene_files = [
              os.path.basename(p)
              for p in sorted(glob.glob("public/scenes/scene-*.jpg"), key=scene_number)
          ]
          props = {
              "title": open("title.txt", encoding="utf-8").read(),
              "scriptText": " ".join(l.strip() for l in open("script.txt", encoding="utf-8") if l.strip()),
              "audioFile": "voiceover.mp3",
              "scenes": scene_files,
          }
          open("props.json", "w", encoding="utf-8").write(json.dumps(props, ensure_ascii=False))
          print(f"props.json written with {len(scene_files)} scene(s): {scene_files}")
          EOF

      - name: Render the Short with Remotion (1080x1920)
        run: npx remotion render src/index.ts AnimeShort out/short-raw.mp4 --props=./props.json --concurrency=4

      - name: Re-encode under 5 MB with ffmpeg (duration-aware bitrate)
        run: |
          # Budget: 4.6 MB total. Video bitrate = budget/duration - audio,
          # so a ~60 s Short lands near ~650 kbps and a ~2 min one near
          # ~250 kbps — the file stays under Make's 5 MB limit either way.
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/short-raw.mp4)
          VB=$(python3 -c "d=float('$DUR'); print(max(150, int((4_600_000*8/d) - 96_000)))")
          echo "Duration ${DUR}s -> video bitrate ${VB} bps"
          ffmpeg -y -i out/short-raw.mp4 \
            -c:v libx264 -b:v ${VB} -maxrate ${VB} -bufsize $((VB * 2)) \
            -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 96k \
            out/short.mp4
          ls -la out/
          SIZE=$(stat -c%s out/short.mp4)
          echo "Final size: $SIZE bytes"
          if [ "$SIZE" -ge 5000000 ]; then
            echo "::error::short.mp4 is still >= 5 MB ($SIZE bytes)"
            exit 1
          fi

      - name: Publish MP4 as release asset (direct link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view daily-latest >/dev/null 2>&1 || gh release create daily-latest --title "Latest rendered Short" --notes "Auto-published by the DYNOSHI render workflow"
          gh release upload daily-latest out/short.mp4 --clobber
          echo "Published: https://github.com/${{ github.repository }}/releases/download/daily-latest/short.mp4"

      - name: Notify Make webhook (if configured)
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
          PAYLOAD_DESCRIPTION: ${{ github.event.client_payload.description }}
          PAYLOAD_TAGS: ${{ toJSON(github.event.client_payload.tags) }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          if [ -z "$MAKE_WEBHOOK_URL" ]; then
            echo "webhook not configured, skipping"
            exit 0
          fi
          python3 - <<'EOF'
          import json, os
          props = json.load(open("props.json", encoding="utf-8"))
          payload = {
              "title": props.get("title", ""),
              "video_url": "https://github.com/henry-an-japan/dynoshi-auto-shorts/releases/download/daily-latest/short.mp4",
              "run_id": os.environ["RUN_ID"],
          }
          # Merge SEO fields: the dispatch client_payload wins; the
          # workflow_dispatch inputs are the fallback.
          desc = os.environ.get("PAYLOAD_DESCRIPTION", "")
          if not desc:
              desc = os.environ.get("INPUT_DESCRIPTION", "")
          if desc:
              payload["description"] = desc
          tags = None
          raw_tags = os.environ.get("PAYLOAD_TAGS", "")
          if raw_tags and raw_tags != "null":
              try:
                  parsed_tags = json.loads(raw_tags)
              except json.JSONDecodeError:
                  parsed_tags = None
              if isinstance(parsed_tags, list):
                  tags = parsed_tags
          if tags is None:
              input_tags = [t.strip() for t in os.environ.get("INPUT_TAGS", "").split(",")]
              tags = [t for t in input_tags if t] or None
          if tags is not None:
              payload["tags"] = tags
          open("payload.json", "w", encoding="utf-8").write(json.dumps(payload, ensure_ascii=False))
          print("payload.json:", payload)
          EOF
          curl -s -X POST "$MAKE_WEBHOOK_URL" -H 'Content-Type: application/json' -d @payload.json
          echo "Make webhook notified."

      - name: Upload the finished Short as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-mp4
          path: out/short.mp4
          retention-days: 7
